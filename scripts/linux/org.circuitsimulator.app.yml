# Flatpak manifest. The runtime is KDE's Qt 6 platform. Build with:
#   flatpak-builder --user --install build scripts/linux/org.circuitsimulator.app.yml
#
# The cargo build needs a network. Qt comes from the runtime, so qmake must
# be the one flatpak-builder puts on PATH inside the sandbox.

app-id: org.circuitsimulator.app
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: circuitsimulator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio
modules:
  - name: circuitsimulator
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/circuitsimulator/cargo
    build-commands:
      - cargo build --release -p cs-app
      - install -Dm755 target/release/circuitsimulator /app/bin/circuitsimulator
    sources:
      - type: dir
        path: ../..
