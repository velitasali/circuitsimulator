[package]
name = "cs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Circuit Simulator Qt Quick shell"

[[bin]]
name = "circuitsimulator"
path = "src/main.rs"
test = false

[dependencies]
qtbridge.workspace = true
serde_json.workspace = true
dirs = "6"
regex = "1"
cs-engine = { path = "../cs-engine" }
vello = { version = "0.5", default-features = false, features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.31"

# Same windows crate wgpu-hal uses, so ID3D12Resource matches texture_from_raw.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Pin ash to wgpu-hal's 0.38 so VkImage::from_raw matches texture_from_raw.
[target.'cfg(target_os = "linux")'.dependencies]
ash = "=0.38.0"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
