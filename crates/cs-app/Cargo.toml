[package]
name = "cs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Circuit Simulator Qt Quick shell"

[[bin]]
name = "circuitsimulator"
path = "src/main.rs"
test = false

[dependencies]
qtbridge.workspace = true
serde_json.workspace = true
dirs = "6"
regex = "1"
cs-engine = { path = "../cs-engine" }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
